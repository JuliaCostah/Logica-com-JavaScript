<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery</title>
</head>
<body>
    <script>
        const bairro = prompt('Bairro da entrega: ');
        let taxaEntrega;
        switch (bairro){
            case 'Liberdade':
                taxaEntrega = 5.00
                break
            case 'Ribeira':
            case 'Mussurunga':
                taxaEntrega = 10.00
                break
            case 'Centro':
                taxaEntrega = 8.50
                break
            default:
                taxaEntrega = 4.50
        }
        alert(`Taxa de Entrega: R$ ${taxaEntrega.toFixed(2)}`);
    </script>
</body>
</html>

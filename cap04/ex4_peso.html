<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peso Ideal</title>
    <link rel="icon" href="image/iconbalanca.png" type="image/png">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <img src="image/balanca.jpg" alt="Balança de Peso">
    <h1> Cálculo do Peso Ideal</h1>
    <form>
        <p>
            Nome:
            <input type="text" id="inNome">
        </p>
        <p>
            Sexo: 
            <input type="radio" name="sexo" id="inMasculino" required> Masculino
            <input type="radio" name="sexo" id="inFeminino" required> Feminino
        </p>
        <p>
            Altura:
            <input type="number" id="inAltura" min="0" step="0.01" required>
        </p>
        <input type="submit" value="Calcular Peso Ideal">
        <input type="reset" value="Limpar campos"> 
    </form>
    <h3></h3>
    <script src="js/ex4_peso.js"></script>
</body>
</html>
